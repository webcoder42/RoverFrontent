<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webotme — widget test page</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 400 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #e5e7eb;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Widget test page</h1>
      <p>
        Paste this bot's embed snippet into this file's
        <code>&lt;body&gt;</code>, then replace
        <code>PASTE_YOUR_WEBOTME_API_KEY</code> with the key from
        <strong>Dashboard → Generated Scripts → Copy API key</strong>.
      </p>
      <p>
        Until the key is replaced the loader prints an error and shows a notice
        at the bottom of the page — that is expected.
      </p>
    </main>

    <!--
      PASTE YOUR EMBED SNIPPET BELOW.

      <script async src="http://localhost:5174/static/widget.js?v=20261017-key"
        data-bot-id="YOUR_BOT_ID"
        data-key="PASTE_YOUR_WEBOTME_API_KEY"></script>
    -->
  </body>
</html>
